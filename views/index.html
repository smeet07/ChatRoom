<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Chat Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <div class="join-window">
            <h1>Join a Chat Room</h1>
            <form action="/join" method="post" class="join-form">
                <input type="text" name="user" id="userInput" placeholder="Your name" autocomplete="name" required>
                <input type="text" name="room" id="roomInput" placeholder="Room code" autocomplete="off" required>
                <button type="submit">Join Room</button>
            </form>
        </div>
    </div>

</body>

</html>
