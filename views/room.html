<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ .RoomCode }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <div class="chat-window" hx-ext="ws" ws-connect="/ws/{{ .RoomCode }}">
            <div class="room-header">
                <span>{{ .User }}</span>
                <strong>Room {{ .RoomCode }}</strong>
            </div>
            <div class="messages" id="messages" hx-swap="beforeend" hx-swap-oob="beforeend"></div>
            <form id="form" ws-send>
                <input type="hidden" name="user" value="{{ .User }}">
                <input type="hidden" name="room" value="{{ .RoomCode }}">
                <div class="input-area">
                    <input type="text" name="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required>
                    <button type="submit">Send</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
